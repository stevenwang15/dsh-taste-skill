name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Cheap static gates first: a syntax error or malformed JSON should fail
      # fast, before the slower behavioural suites run.
      - name: Static checks
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('screenshots.json', 'utf8'))"
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done
      # No runtime dependencies and no build step: the suite only needs Node.
      - run: npm test
